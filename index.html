<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Gigi!</title>
<style>
:root{--bg:#ffe4ec;--card:#fff5f8;--ink:#8a3b58;--accent:#ff8fb1;--accent-ink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#ffe4ec;--card:#fff5f8;--ink:#8a3b58}}
:root[data-theme="dark"]{--bg:#ffe4ec;--card:#fff5f8;--ink:#8a3b58}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;text-align:center;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:28px 16px 40px;position:relative}
h1{font-size:clamp(2rem,9vw,3rem);margin:0 0 4px}
p{margin:0 0 12px}
.stage{position:relative;background:var(--card);border-radius:32px;padding:24px 8px 12px;box-shadow:0 10px 30px rgba(255,143,177,.35);margin:16px 0}
#dog{width:100%;max-width:440px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
#dog.hop{animation:hop .5s ease-out}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-26px) rotate(-2deg)}}
#tail{transform-origin:64px 100px;animation:wag .6s ease-in-out infinite alternate}
#dog.happy #tail{animation-duration:.12s}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
#eye{transform-origin:338px 88px;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#bubble{position:absolute;top:6px;right:10px;background:#fff;border:3px solid var(--accent);border-radius:18px;padding:6px 14px;font-weight:700;opacity:0;transform:scale(.6);transition:.2s}
#bubble.on{opacity:1;transform:scale(1)}
.heart{position:absolute;pointer-events:none;font-size:26px;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translateY(-140px) scale(1.3);opacity:0}}
button{font:inherit;font-weight:700;font-size:1.1rem;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:.7em 1.6em;cursor:pointer;margin:4px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.conf{position:fixed;top:-20px;width:10px;height:14px;pointer-events:none;animation:fall 2.6s linear forwards;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){#tail,#eye{animation:none}.conf{display:none}}
</style>
</head>
<body>
<main>
  <h1 id="title">Happy Birthday, Gigi! 🎂</h1>
  <p>Tap Gigi to say hi!</p>
  <div class="stage" id="stage">
    <div id="bubble">Woof! 🐾</div>
    <svg id="dog" viewBox="0 0 420 210" xmlns="http://www.w3.org/2000/svg" role="button" aria-label="Gigi the dachshund. Tap to pet her.">
      <ellipse cx="205" cy="190" rx="170" ry="9" fill="#f3b9cb"/>
      <path id="tail" d="M66 98 Q22 70 34 28 Q48 62 72 84 Z" fill="#9a5a38"/>
      <rect x="62" y="132" width="26" height="52" rx="12" fill="#7d4528"/>
      <rect x="104" y="132" width="26" height="52" rx="12" fill="#7d4528"/>
      <rect x="62" y="82" width="238" height="66" rx="33" fill="#a8643f"/>
      <rect x="226" y="132" width="26" height="52" rx="12" fill="#7d4528"/>
      <rect x="266" y="132" width="26" height="52" rx="12" fill="#7d4528"/>
      <ellipse cx="324" cy="96" rx="40" ry="34" fill="#a8643f"/>
      <ellipse cx="366" cy="110" rx="34" ry="20" fill="#b9754e"/>
      <circle cx="396" cy="104" r="9" fill="#3a2016"/>
      <path d="M350 122 Q366 130 382 120" stroke="#3a2016" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="306" cy="104" rx="17" ry="34" fill="#7d4528" transform="rotate(12 306 104)"/>
      <circle id="eye" cx="338" cy="88" r="6" fill="#2a140c"/>
      <circle cx="340" cy="86" r="2" fill="#fff"/>
      <path d="M284 112 L300 108 L304 124 L288 128 Z" fill="#ff8fb1"/>
      <path d="M296 126 l-8 14 l8 -4 l8 4 z" fill="#ff6f9c"/>
      <polygon points="300,62 344,62 322,14" fill="#ff8fb1"/>
      <path d="M306 50 L338 50 M311 36 L333 36" stroke="#fff" stroke-width="4"/>
      <circle cx="322" cy="12" r="7" fill="#fff"/>
    </svg>
  </div>
  <p id="count">Pets: 0</p>
  <button id="treat">Give a treat 🦴</button>
  <button id="party">Party time! 🎉</button>
</main>

<script>
(function(){
  var n=new URLSearchParams(location.search).get("name");
  if(n){document.getElementById("title").textContent="Happy Birthday, "+n+"! 🎂";document.title="Happy Birthday "+n+"!";}
  var dog=document.getElementById("dog"),bubble=document.getElementById("bubble"),stage=document.getElementById("stage"),count=document.getElementById("count");
  var pets=0,t1,t2;
  var words=["Woof! 🐾","Arf arf!","Yip! 💕","More pets!","Zoomies!"];
  function hearts(k){
    var r=dog.getBoundingClientRect(),s=stage.getBoundingClientRect();
    for(var i=0;i<k;i++){
      var h=document.createElement("span");h.className="heart";h.textContent=["💗","💖","💕"][i%3];
      h.style.left=(r.left-s.left+r.width*(0.55+Math.random()*0.4))+"px";
      h.style.top=(r.top-s.top+r.height*0.2)+"px";
      stage.appendChild(h);setTimeout(function(x){return function(){x.remove();};}(h),1500);
    }
  }
  function say(t){
    bubble.textContent=t;bubble.classList.add("on");
    clearTimeout(t1);t1=setTimeout(function(){bubble.classList.remove("on");},1100);
  }
  function hop(){
    dog.classList.remove("hop");void dog.getBoundingClientRect();dog.classList.add("hop","happy");
    clearTimeout(t2);t2=setTimeout(function(){dog.classList.remove("happy");},1500);
  }
  function pet(){
    pets++;count.textContent="Pets: "+pets;
    say(pets%10===0?"Best girl ever! 💖":words[pets%words.length]);
    hop();hearts(4);
    try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
  }
  function confetti(){
    var c=["#ff8fb1","#ffd1df","#fff","#ffc94d","#c8a2ff"];
    for(var i=0;i<60;i++){
      var d=document.createElement("span");d.className="conf";
      d.style.left=Math.random()*100+"vw";d.style.background=c[i%c.length];
      d.style.animationDelay=Math.random()*0.8+"s";
      document.body.appendChild(d);setTimeout(function(x){return function(){x.remove();};}(d),3600);
    }
  }
  dog.addEventListener("click",pet);
  document.getElementById("treat").addEventListener("click",function(){say("Yum! 🦴");hop();hearts(6);});
  document.getElementById("party").addEventListener("click",function(){confetti();say("Party! 🎉");hop();});
})();
</script>
</body>
</html>
